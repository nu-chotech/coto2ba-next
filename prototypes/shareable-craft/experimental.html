<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ことば錬成・演算比較の試作</title>
    <style>
      :root { font-family: system-ui, sans-serif; color: #f4f1ff; background: #171325; }
      body { max-width: 780px; margin: auto; padding: 24px; }
      p { line-height: 1.6; } a { color: #c9a9ff; }
      .panel, .result { background: #29233d; border: 1px solid #63537c; border-radius: 14px; padding: 16px; margin: 12px 0; }
      label { display: grid; gap: 6px; margin: 12px 0; }
      select, button { font: inherit; padding: 10px; border-radius: 8px; }
      button { cursor: pointer; background: #b798ee; border: 0; color: #171325; font-weight: 700; }
      input[type=range] { width: 100%; }
      .muted { color: #c3b7d4; font-size: .9rem; }
      .result { display: grid; grid-template-columns: 8em 1fr; gap: 6px 12px; }
      .result p { grid-column: 1 / -1; margin: 0; }
    </style>
  </head>
  <body>
    <a href="./index.html">候補選択の試作へ</a>
    <h1>同じ素材でも、演算で結果は変わる？</h1>
    <p class="muted">固定12語の模擬ベクトルで、Python案の5演算を見比べる独立試作です。結果語は仮の最近傍1語で、本番APIの重み付き選択とは一致しません。現行Expo画面は変更していません。</p>
    <section class="panel">
      <p>現在語 <strong>りんご</strong> ／ 目標語 <strong>宇宙</strong></p>
      <label>混ぜる語 <select id="ingredient"></select></label>
      <label>入力語の割合 <output id="ratio-value">50%</output><input id="ratio" type="range" min="10" max="80" step="10" value="50" /></label>
      <button type="button" id="compare">5演算を比較</button>
    </section>
    <section aria-live="polite"><h2>比較結果</h2><div id="results"></div></section>
    <script type="module" src="./experimental.js"></script>
  </body>
</html>
