name: Deploy API

on:
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - "packages/**"
  pull_request:
    paths:
      - "apps/api/**"
      - "packages/**"
  workflow_dispatch: {}

concurrency:
  # PR は PR 番号ごと（新しい push で古い preview デプロイを打ち切る）。
  # production は 1 本に直列化し、走行中のデプロイを途中で殺さない。
  group: deploy-api-${{ github.event_name == 'pull_request' && format('preview-{0}', github.event.number) || 'production' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: write

jobs:
  deploy:
    name: Build + Deploy (${{ github.event_name == 'pull_request' && 'preview' || 'production' }})
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'pull_request' && 'preview' || 'production' }}
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_API }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # secrets は job 単位の if: では参照できないので、最初の step で見て以降を切り替える。
      # 未登録でもビルドと束ね検証は走らせる（デプロイ鍵が無いこととコードが壊れていることは別）。
      - name: Check deploy secrets
        id: guard
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_API }}
          DATABASE_URL_DIRECT: ${{ secrets.DATABASE_URL_DIRECT }}
        run: |
          set -euo pipefail
          missing=()
          [ -n "${VERCEL_TOKEN}" ]        || missing+=("VERCEL_TOKEN")
          [ -n "${VERCEL_ORG_ID}" ]       || missing+=("VERCEL_ORG_ID")
          [ -n "${VERCEL_PROJECT_ID}" ]   || missing+=("VERCEL_PROJECT_ID_API")
          [ -n "${DATABASE_URL_DIRECT}" ] || missing+=("DATABASE_URL_DIRECT")
          if [ ${#missing[@]} -eq 0 ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=デプロイを飛ばしました::未登録の secret: ${missing[*]}（ビルド検証は実行します）"
            {
              echo "### Deploy API — ビルド検証のみ実行"
              echo
              echo "以下の GitHub Secrets が未登録なので、migrate とデプロイは飛ばしました:"
              for m in "${missing[@]}"; do echo "- \`${m}\`"; done
              echo
              echo "tsup のバンドルとワークスペース import の検証は実行済みです。"
              echo "取得方法は \`docs/PROGRESS.md\` の「GitHub Secrets」を参照。"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # PR からは絶対に migrate しない（production の Neon に PR のスキーマが流れると事故になる）。
      - name: Run database migrations (direct connection)
        if: steps.guard.outputs.configured == 'true' && github.event_name != 'pull_request'
        run: pnpm --filter @coto2ba/api exec drizzle-kit migrate
        env:
          DATABASE_URL_DIRECT: ${{ secrets.DATABASE_URL_DIRECT }}

      # ---- Vercel の環境取得（プロジェクト設定と環境変数のみ。.vercel/output には触らない）----
      - name: Vercel pull (production environment)
        if: steps.guard.outputs.configured == 'true' && github.event_name != 'pull_request'
        working-directory: apps/api
        run: npx vercel@59 pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Vercel pull (preview environment)
        if: steps.guard.outputs.configured == 'true' && github.event_name == 'pull_request'
        working-directory: apps/api
        run: npx vercel@59 pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}

      # ARCHITECTURE §4: Vercel 側ではビルドさせない（pnpm workspace + tsconfig paths が
      # zero-config ビルドで壊れる）。tsup で自己完結 ESM に束ね、Build Output API v3
      # （runtime nodejs22.x / maxDuration 30 / regions ["sin1"]）を自前で書き出して
      # --prebuilt で渡す。`vercel build` は .vercel/output を作り直してこの設定を捨てるので使わない。
      #
      # secrets が無くても実行する。ここが通るかどうかはコードの健全性の問題で、
      # デプロイ鍵の有無とは無関係。
      - name: Build API (tsup + Vercel Build Output API v3)
        run: pnpm --filter @coto2ba/api build:vercel

      # ARCHITECTURE §4 の検証。ワークスペース依存がバンドルに畳み込まれず
      # import として残っていると、Vercel 上で実行時に解決できず 500 になる。
      # workspace の import が残っていると Vercel 側で解決できず落ちる。
      # ただし **文字列の単純一致では駄目**。JSDoc コメントに `@coto2ba/contracts` と
      # 書いてあるだけで落ちていた（2026-09-18）。import / require / 動的 import の
      # 形になっているものだけを見る。
      - name: Verify bundle has no workspace imports
        run: |
          hits=$(grep -cE "from ['\"]@coto2ba|require\(['\"]@coto2ba|import\(['\"]@coto2ba" \
            apps/api/api/index.mjs || true)
          if [ "$hits" -ne 0 ]; then
            echo "::error::バンドルに workspace の import が $hits 件残っています"
            grep -nE "from ['\"]@coto2ba|require\(['\"]@coto2ba|import\(['\"]@coto2ba" \
              apps/api/api/index.mjs | head -5
            exit 1
          fi
          echo "workspace の import なし"


      # ---- production 経路（main への push / 手動実行）----
      - name: Vercel deploy (prebuilt, production)
        if: steps.guard.outputs.configured == 'true' && github.event_name != 'pull_request'
        working-directory: apps/api
        run: npx vercel@59 deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}

      # ---- preview 経路（PR）----
      - name: Vercel deploy (prebuilt, preview)
        id: deploy_preview
        if: steps.guard.outputs.configured == 'true' && github.event_name == 'pull_request'
        working-directory: apps/api
        run: |
          set -euo pipefail
          # deploy は進捗を stderr、最終的な URL を stdout に出す。
          url="$(npx vercel@59 deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }} | tail -n 1)"
          echo "preview URL: ${url}"
          echo "url=${url}" >> "$GITHUB_OUTPUT"

      - name: Comment preview URL on the PR
        if: steps.guard.outputs.configured == 'true' && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: ${{ steps.deploy_preview.outputs.url }}
        with:
          script: |
            const marker = '<!-- deploy-api-preview -->';
            const body = [
              marker,
              '### API preview デプロイ',
              '',
              `- URL: ${process.env.PREVIEW_URL}`,
              `- commit: \`${context.payload.pull_request.head.sha.slice(0, 7)}\``,
              '',
              '> migrate はこの経路では実行していない（production の Neon を触らないため）。',
            ].join('\n');

            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.rest.issues.listComments({ owner, repo, issue_number, per_page: 100 });
            const existing = comments.data.find((c) => c.body && c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
