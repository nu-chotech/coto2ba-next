name: Deploy Landing

on:
  push:
    branches: [main]
    paths:
      - "apps/landing/**"
  workflow_dispatch: {}

concurrency:
  group: deploy-landing-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build + Deploy (production)
    runs-on: ubuntu-latest
    environment: production
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_LANDING }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # secrets は job 単位の if: では参照できないので、最初の step で見て以降を切り替える。
      # 未登録のときに「失敗」にしないのは、まだ設定されていないだけで
      # 壊れてはいないから。赤が常態化すると本当の失敗に気づけなくなる。
      - name: Check deploy secrets
        id: guard
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_LANDING }}
        run: |
          set -euo pipefail
          missing=()
          [ -n "${VERCEL_TOKEN}" ]      || missing+=("VERCEL_TOKEN")
          [ -n "${VERCEL_ORG_ID}" ]     || missing+=("VERCEL_ORG_ID")
          [ -n "${VERCEL_PROJECT_ID}" ] || missing+=("VERCEL_PROJECT_ID_LANDING")
          if [ ${#missing[@]} -eq 0 ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=デプロイを飛ばしました::未登録の secret: ${missing[*]}"
            {
              echo "### Deploy Landing — 設定待ちのため未実行"
              echo
              echo "以下の GitHub Secrets が未登録です:"
              for m in "${missing[@]}"; do echo "- \`${m}\`"; done
              echo
              echo "登録すると、このワークフローは次の push から実際にデプロイします。"
              echo "取得方法は \`docs/PROGRESS.md\` の「GitHub Secrets」を参照。"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Vercel pull (production environment)
        if: steps.guard.outputs.configured == 'true'
        working-directory: apps/landing
        run: npx vercel@59 pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      # apps/landing は index.html 1 枚。**`vercel build` + `--prebuilt` を使わない。**
      #
      # 理由が 2 つある。
      # 1. ローカルビルドさせると `vercel build` がルートの pnpm-lock.yaml を検出して
      #    `pnpm install` を始める。このジョブには pnpm を入れていないので
      #    `spawn pnpm ENOENT` で落ちる（vercel.json の installCommand は `null`。
      #    Vercel では null は「未設定＝既定で install する」であって「何もしない」ではない）。
      # 2. それ以前に、`cleanUrls: true` + `outputDirectory: "."` の組み合わせで
      #    `vercel build` が吐く output は index.html をパス `index` に登録し、
      #    `/` を誰も配信しない状態になる（`/index` は `/` に 308 で戻されるだけ）。
      #    実際にこれで本番が 404 になった。Vercel 側でビルドさせれば正しく `/` が出る。
      #
      # apps/api と違ってこちらは Vercel の zero-config ビルドで問題ないので、
      # 素直に転送してビルドしてもらう。
      - name: Vercel deploy (production)
        if: steps.guard.outputs.configured == 'true'
        working-directory: apps/landing
        run: npx vercel@59 deploy --prod --token=${{ secrets.VERCEL_TOKEN }}
